<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COAL-GUARD AI | Secure Access</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            min-height: 100vh;
            background: 
                radial-gradient(circle at 20% 20%, rgba(6, 182, 212, 0.12), transparent 35%),
                radial-gradient(circle at 80% 80%, rgba(245, 158, 11, 0.08), transparent 35%),
                #0b0f17;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f3f4f6;
        }

        .container {
            width: 100%;
            max-width: 440px;
            padding: 20px;
        }

        .login-card {
            background: rgba(17, 24, 39, 0.95);
            border: 1px solid rgba(6, 182, 212, 0.25);
            border-radius: 16px;
            padding: 36px 32px;
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.8),
                0 0 30px rgba(6, 182, 212, 0.1);
            backdrop-filter: blur(8px);
        }

        .logo {
            width: 72px;
            height: 72px;
            margin: 0 auto 16px;
            border-radius: 16px;
            background: linear-gradient(135deg, #06b6d4, #0891b2);
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            box-shadow: 0 0 25px rgba(6, 182, 212, 0.35);
        }

        h1 {
            text-align: center;
            font-size: 24px;
            letter-spacing: 2px;
            color: #ffffff;
            margin-bottom: 6px;
            font-weight: 700;
        }

        .subtitle {
            text-align: center;
            color: #9ca3af;
            font-size: 13px;
            margin-bottom: 22px;
        }

        .system-status {
            text-align: center;
            color: #10b981;
            font-size: 11px;
            margin-bottom: 24px;
            letter-spacing: 1.5px;
            font-weight: 600;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 11px;
            color: #9ca3af;
            margin-bottom: 7px;
            letter-spacing: 1px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border-radius: 8px;
            border: 1px solid #374151;
            outline: none;
            background: #0f172a;
            color: #f3f4f6;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: #06b6d4;
            box-shadow: 0 0 12px rgba(6, 182, 212, 0.25);
            background: #111827;
        }

        .main-btn {
            width: 100%;
            margin-top: 8px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: #0f172a;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 1.5px;
            background: linear-gradient(135deg, #06b6d4, #0891b2);
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(6, 182, 212, 0.25);
        }

        .main-btn:hover {
            transform: translateY(-1px);
            background: linear-gradient(135deg, #22d3ee, #06b6d4);
            box-shadow: 0 6px 20px rgba(6, 182, 212, 0.4);
        }

        .switch {
            text-align: center;
            margin-top: 22px;
            color: #6b7280;
            font-size: 12px;
        }

        .switch button {
            border: none;
            background: none;
            color: #06b6d4;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            margin-left: 4px;
        }

        .switch button:hover {
            text-decoration: underline;
            color: #22d3ee;
        }

        .message {
            display: none;
            margin-top: 16px;
            padding: 11px;
            border-radius: 8px;
            text-align: center;
            font-size: 12px;
            font-weight: 500;
        }

        .error {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.35);
            color: #fca5a5;
        }

        .success {
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.35);
            color: #6ee7b7;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 16px;
            color: #06b6d4;
            font-size: 12px;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .hidden {
            display: none;
        }

        .footer {
            text-align: center;
            margin-top: 24px;
            color: #4b5563;
            font-size: 10px;
            line-height: 1.6;
            letter-spacing: 0.5px;
        }

        .footer span {
            color: #f59e0b;
            font-weight: 600;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 30px 22px;
            }
            h1 {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

<div class="container">
    <div class="login-card">
        <div class="logo">⛑</div>

        <h1>COAL-GUARD AI</h1>
        <div class="subtitle">Smart Coal Mine Governance & Safety System</div>
        <div class="system-status">● SECURE SYSTEM ONLINE</div>

        <!-- LOGIN FORM -->
        <div id="loginSection">
            <form id="loginForm">
                <div class="input-group">
                    <label for="loginUsername">USERNAME / EMAIL</label>
                    <input type="text" id="loginUsername" placeholder="Enter your username" required>
                </div>

                <div class="input-group">
                    <label for="loginPassword">PASSWORD</label>
                    <input type="password" id="loginPassword" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="main-btn">SECURE LOGIN</button>
            </form>

            <div id="loginError" class="message error">Invalid username or password.</div>
            <div id="loginLoading" class="loading">AUTHENTICATING... PLEASE WAIT</div>

            <div class="switch">
                Don't have an account?
                <button type="button" onclick="showCreateAccount()">Create Account</button>
            </div>
        </div>

        <!-- CREATE ACCOUNT FORM -->
        <div id="createSection" class="hidden">
            <form id="createForm">
                <div class="input-group">
                    <label for="fullName">FULL NAME</label>
                    <input type="text" id="fullName" placeholder="Enter your full name" required>
                </div>

                <div class="input-group">
                    <label for="createUsername">USERNAME / EMAIL</label>
                    <input type="text" id="createUsername" placeholder="Create a username" required>
                </div>

                <div class="input-group">
                    <label for="createPassword">PASSWORD</label>
                    <input type="password" id="createPassword" placeholder="Create a password" required>
                </div>

                <div class="input-group">
                    <label for="confirmPassword">CONFIRM PASSWORD</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm your password" required>
                </div>

                <button type="submit" class="main-btn">CREATE ACCOUNT</button>
            </form>

            <div id="createError" class="message error"></div>
            <div id="createSuccess" class="message success"></div>

            <div class="switch">
                Already have an account?
                <button type="button" onclick="showLogin()">Login</button>
            </div>
        </div>

        <div class="footer">
            SIH INDUSTRIAL EDITION<br>
            <span>Authorized Personnel Only</span>
        </div>
    </div>
</div>

<script>
    const COAL_GUARD_URL = "https://sejxll.github.io/coalmine-safety/";
    const ADMIN_USERNAME = "admin";
    const ADMIN_PASSWORD = "admin123";

    function showCreateAccount() {
        document.getElementById("loginSection").classList.add("hidden");
        document.getElementById("createSection").classList.remove("hidden");
        clearMessages();
    }

    function showLogin() {
        document.getElementById("createSection").classList.add("hidden");
        document.getElementById("loginSection").classList.remove("hidden");
        clearMessages();
    }

    function clearMessages() {
        document.getElementById("loginError").style.display = "none";
        document.getElementById("createError").style.display = "none";
        document.getElementById("createSuccess").style.display = "none";
    }

    document.getElementById("createForm").addEventListener("submit", function(event) {
        event.preventDefault();
        const name = document.getElementById("fullName").value.trim();
        const username = document.getElementById("createUsername").value.trim();
        const password = document.getElementById("createPassword").value;
        const confirmPassword = document.getElementById("confirmPassword").value;
        const error = document.getElementById("createError");
        const success = document.getElementById("createSuccess");

        error.style.display = "none";
        success.style.display = "none";

        if (password.length < 6) {
            error.textContent = "Password must contain at least 6 characters.";
            error.style.display = "block";
            return;
        }

        if (password !== confirmPassword) {
            error.textContent = "Passwords do not match.";
            error.style.display = "block";
            return;
        }

        const existingAccount = localStorage.getItem("coalGuardAccount");
        if (existingAccount) {
            const account = JSON.parse(existingAccount);
            if (account.username.toLowerCase() === username.toLowerCase()) {
                error.textContent = "This account already exists.";
                error.style.display = "block";
                return;
            }
        }

        const account = { name: name, username: username, password: password };
        localStorage.setItem("coalGuardAccount", JSON.stringify(account));

        success.textContent = "Account created successfully! You can now login.";
        success.style.display = "block";
        document.getElementById("createForm").reset();

        setTimeout(function() {
            showLogin();
        }, 1500);
    });

    document.getElementById("loginForm").addEventListener("submit", function(event) {
        event.preventDefault();
        const username = document.getElementById("loginUsername").value.trim();
        const password = document.getElementById("loginPassword").value;
        const error = document.getElementById("loginError");
        const loading = document.getElementById("loginLoading");

        error.style.display = "none";
        let validLogin = false;

        if (username === ADMIN_USERNAME && password === ADMIN_PASSWORD) {
            validLogin = true;
        }

        const savedAccount = localStorage.getItem("coalGuardAccount");
        if (savedAccount) {
            const account = JSON.parse(savedAccount);
            if (account.username.toLowerCase() === username.toLowerCase() && account.password === password) {
                validLogin = true;
            }
        }

        if (validLogin) {
            loading.style.display = "block";
            setTimeout(function() {
                window.location.href = COAL_GUARD_URL;
            }, 500);
        } else {
            error.textContent = "Invalid username or password.";
            error.style.display = "block";
        }
    });
</script>

</body>
</html>
